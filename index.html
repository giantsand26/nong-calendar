<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f5fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=19">
  <title>农的日程</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><h1>我的日程</h1><p id="todayLabel"></p></div>
      <div class="top-actions"><small class="build-version">v19</small><button id="addBtn" class="icon-button" aria-label="新建日程">＋</button></div>
    </header>

    <nav class="view-tabs" aria-label="日历视图">
      <button data-view="month" class="active">月</button>
      <button data-view="week">周</button>
      <button data-view="day">日</button>
    </nav>

    <section class="calendar-card">
      <div class="calendar-head">
        <button id="previousBtn" aria-label="上一段">‹</button>
        <strong id="periodTitle"></strong>
        <button id="nextBtn" aria-label="下一段">›</button>
      </div>
      <div id="calendarView"></div>
    </section>

    <section class="day-panel">
      <div class="section-title">
        <h2 id="selectionTitle"></h2>
        <button id="importBtn" class="primary">导入</button>
      </div>
      <div id="eventList"></div>
    </section>

    <section class="tools">
      <button id="exportBtn" class="text-button">导出备份</button>
      <label class="text-button">恢复备份<input id="restoreInput" type="file" accept="application/json" hidden></label>
    </section>
  </main>

  <dialog id="editorDialog">
    <form method="dialog" id="editorForm">
      <header class="dialog-head"><h2 id="editorTitle">导入日程</h2><button id="closeEditorBtn" type="button" class="close-button">关闭</button></header>
      <section id="importSection">
        <textarea id="sourceText" placeholder="粘贴微信聊天内容，或选择微信截图"></textarea>
        <div class="actions">
          <label id="photoBtn" class="secondary file-button" for="photoInput">选择截图/附件</label>
          <input id="photoInput" class="visually-hidden" type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx" multiple>
          <button id="recognizeBtn" type="button" class="primary">识别内容</button>
        </div>
        <p id="ocrStatus" class="hint" role="status" aria-live="polite">文字和附件只保存在此设备浏览器中。</p>
      </section>
      <section id="fields" class="fields">
        <label>标题<input id="titleInput" required></label>
        <div class="two-column"><label>日期<input id="dateInput" type="date" required></label><label>状态<select id="statusInput"><option>待确认</option><option>已确认</option><option>已取消</option></select></label></div>
        <label>我的环节时间<input id="personalTimeInput" placeholder="17:30–17:50"></label>
        <label>会议总时间<input id="meetingTimeInput" placeholder="16:00–18:00"></label>
        <div class="two-column"><label>类型<select id="typeInput"><option>会议</option><option>出差/外出</option><option>其他</option></select></label><fieldset class="role-field"><legend>我的角色</legend><div class="role-options"><label><input type="checkbox" name="role" value="讲者">讲者</label><label><input type="checkbox" name="role" value="讨论">讨论</label><label><input type="checkbox" name="role" value="主持">主持</label></div></fieldset></div>
        <label>地点<input id="locationInput"></label>
        <div class="two-column"><label>会议链接<input id="urlInput" type="url"></label><label>会议号<input id="meetingIdInput" placeholder="692-195-665"></label></div>
        <label>相关人员<input id="peopleInput"></label>
        <label>提醒（提前分钟，逗号分隔）<input id="remindersInput" placeholder="1440,60,10"></label>
        <label>备注<textarea id="notesInput"></textarea></label>
        <div id="attachmentList" class="attachments"></div>
      </section>
      <footer class="dialog-actions"><button id="deleteBtn" type="button" class="danger hidden">删除</button><button id="saveBtn" value="default" class="primary">保存</button></footer>
    </form>
  </dialog>

  <dialog id="attachmentPreviewDialog" class="preview-dialog">
    <header class="dialog-head preview-head"><h2 id="attachmentPreviewTitle">附件预览</h2><button id="closeAttachmentPreview" type="button" class="close-button">关闭</button></header>
    <div class="preview-body"><img id="attachmentPreviewImage" alt="附件图片"></div>
    <footer class="preview-actions"><a id="downloadAttachment" class="primary" download>下载原图</a></footer>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="app.js?v=19"></script>
</body>
</html>
